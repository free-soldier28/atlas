<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Atlas</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=theme-color content=#05222b>
<style>
/* The class on <body> is the state of the page: l = loading (l e = failed to start), p = mouse captured,
   w = settings drawer open. Palette: marble #f2eadb, gold inlay #e2bf6e, deep lagoon #05222b */
html { background: #05222b; }
body {
  --wd: min(320px, 88vw); /* settings drawer width, shared with the stack's slide */
  position: fixed; inset: 0; margin: 0; overflow: hidden; background: radial-gradient(at 65%, #1d4a66, #05222b 75%);
  font: 700 clamp(13px, .6vw + .8vh, 26px)/1.4 system-ui, sans-serif; color: #f2eadb; user-select: none;
}
/* a phone held upright gets the whole page turned on its side, so the scene is always landscape */
@media (orientation: portrait) and (pointer: coarse) {
  body { right: auto; bottom: auto; width: 100dvh; height: 100dvw; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
}
canvas { position: absolute; width: 100%; height: 100%; cursor: crosshair; touch-action: none; transition: opacity 2s; }
.l canvas { opacity: 0; }

button, a { padding: 0; border: 0; background: none; font: inherit; letter-spacing: inherit; color: inherit; text-decoration: none; cursor: pointer; }
:focus-visible { outline: 2px solid #fbe6a8; outline-offset: .2em; }
p { margin: 0; }

/* loading: a slim plate bottom-centre — city name, progress line, status, attribution. Fades when the scene is live */
#ld {
  position: absolute; bottom: 3em; left: 50%; transform: translateX(-50%); display: grid; justify-items: center; gap: .5em;
  padding: 1.1em 1.8em; border-radius: .6em; background: rgba(15, 20, 28, .72); text-align: center; transition: opacity .6s, visibility .6s;
}
body:not(.l) #ld { opacity: 0; visibility: hidden; }
#cn { font: 1.5em/1.2 "Palatino Linotype", Palatino, "Book Antiqua", Constantia, Georgia, serif; letter-spacing: .12em; color: #e2bf6e; }
#cn:empty { display: none; }
/* the gold line under the name is the loading bar */
#p { width: 15em; max-width: 60vw; height: 3px; background: #e2bf6e40; }
#b { display: block; height: 100%; background: #e2bf6e; box-shadow: 0 0 .8em #e2bf6e; transform: scaleX(0); transform-origin: 0; transition: transform .4s; }
.e #p { visibility: hidden; }
#s { font-size: .8em; letter-spacing: .15em; text-transform: uppercase; color: #e2bf6e; max-width: 26em; }
.e #s { letter-spacing: 0; text-transform: none; color: #f2eadb; }
#at { font-size: .68em; color: #f2eadb80; }

/* top-right button stack: round dark-glass buttons, 44 px hit targets, hidden until the scene is live;
   with the drawer open it slides to its left edge (a transform: compositor-only, no layout per frame),
   so the ⚙ stays reachable and nothing is covered */
#t { position: absolute; top: .7em; right: .7em; display: grid; gap: .55em; z-index: 2; transition: opacity .4s, visibility .4s, transform .3s; }
.w #t { transform: translateX(calc(-1 * var(--wd) + .3em)); }
.l #t, .e #t { opacity: 0; visibility: hidden; }
.p #t { opacity: 0; }
#t button {
  width: 44px; height: 44px; border-radius: 50%; background: rgba(15, 20, 28, .72); color: #f2eadb;
  font-size: 19px; line-height: 1; transition: background .15s, color .15s;
}
#t button:hover { background: rgba(32, 40, 54, .85); color: #fff; }
#t button.on { background: #e2bf6e; color: #05222b; }

/* settings drawer: slides in from the right; the scene keeps running behind it. z-index under the stack, so
   the ⚙ button stays clickable with the drawer open */
#w {
  position: absolute; top: 0; right: 0; bottom: 0; width: var(--wd); box-sizing: border-box; padding: 1em 1.1em; overflow-y: auto;
  background: rgba(15, 20, 28, .72); backdrop-filter: blur(8px); box-shadow: -1px 0 #e2bf6e40;
  transform: translateX(105%); transition: transform .3s; z-index: 1;
}
#w.open { transform: none; }
.lb { margin: 1em 0 .4em; font-size: .7em; letter-spacing: .18em; text-transform: uppercase; color: #e2bf6e; }
.lb:first-child { margin-top: .2em; }
/* drawer rows: label left, FIXED-width controls right. A toggle always has its own track —
   earlier flex:1 stretched on/off buttons to random widths and the off state had no background. */
#q, #dn, #ci, #gp, .sw { display: grid; align-items: center; gap: .3em; padding: .3em .5em; margin: 0; border-radius: .45em; background: rgba(255, 255, 255, .055); font-size: .82em; letter-spacing: .05em; }
.sw, #gp { grid-template-columns: 1fr 76px; }
#dn { grid-template-columns: 1fr 64px 64px; }
#q, #ci { grid-template-columns: 1fr 60px 60px 60px; }
#ci[hidden] { display: none; }
#q span, #dn span, #ci span, #gp span, .sw span { color: #e2bf6e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#q button, #dn button, #ci button, #gp button, .sw button {
  width: 100%; min-height: 32px; padding: .2em; border-radius: .3em; text-align: center;
  background: rgba(255, 255, 255, .09); color: #f2eadbd9; box-shadow: inset 0 0 0 1px rgba(226, 191, 110, .18);
  transition: background .15s, color .15s;
}
#q button:not(.on):hover, #dn button:not(.on):hover, #ci button:not(.on):hover, #gp button:not(.on):hover, .sw button:not(.on):hover { background: #e2bf6e35; color: #f2eadb; }
#q .on, #dn .on, #ci .on, #gp .on, .sw .on { background: #e2bf6e; color: #05222b; box-shadow: none; font-weight: 600; }
#q .on, #dn .on, #ci .on { pointer-events: none; } /* segments show a selection; toggles stay clickable */

/* key bindings, two columns */
#ky { display: grid; grid-template-columns: max-content 1fr; gap: .25em .8em; align-items: baseline; margin: 0; font-size: .74em; color: #f2eadbd9; }
#ky b { min-width: 2.4em; padding: .12em .5em; border-radius: .25em; background: #f2eadb1c; color: #f2eadb; text-align: center; white-space: nowrap; }
#ky i { font-style: normal; }
/* drawer footer: what this pack is, and which engine is showing it */
#pv { margin-top: 1.2em; padding-top: .8em; border-top: 1px solid #e2bf6e2e; font-size: .66em; line-height: 1.7; color: #f2eadb80; }

#i {
  position: absolute; top: 1em; left: 1.2em; margin: 0; font: .75em/1.5 ui-monospace, Consolas, monospace;
  white-space: pre-wrap; text-shadow: 0 1px 3px #000, 0 0 2px #000; pointer-events: none;
}
/* the gps simulator's state probe (?auto&gps=sim fills it once a second, for headless tests) */
#drive {
  position: absolute; bottom: 2.8em; left: 1.2em; margin: 0; font: .75em/1.4 ui-monospace, Consolas, monospace;
  color: #e2bf6e; text-shadow: 0 1px 3px #000, 0 0 2px #000; pointer-events: none;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* label overlay: house numbers and street names projected from the world each frame */
#labs { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.lab { position: absolute; left: 0; top: 0; white-space: nowrap; padding: 2px 6px; border-radius: 5px;
  font: 600 11px/1.25 system-ui, sans-serif; color: #fff; background: #121614b8;
  box-shadow: 0 1px 3px #0006; text-shadow: 0 1px 1px #0008; }
.lab.street { font-size: 12px; color: #d9ecff; background: #1a2834c9; }
</style>
</head>
<body class=l>
<canvas id=c></canvas>
<div id=labs></div>

<!-- loading plate: city name and attribution arrive with the pack header -->
<div id=ld>
  <p id=cn></p>
  <div id=p><i id=b></i></div>
  <p id=s>Raising the city…</p>
  <p id=at>© OpenStreetMap contributors</p>
</div>

<!-- top-right stack: settings, day/night, stats, locate, city -->
<div id=t>
  <button id=st title="Settings (Esc)">⚙</button>
  <button id=nt title="Day / night (N)">🌙</button>
  <button id=hs title="Stats (H)">📊</button>
  <button id=lc title="Locate me">📍</button>
  <button id=ct title="City">🏙</button>
</div>

<!-- settings drawer: the rows the old menu carried, plus toggles, keys and pack info -->
<div id=w>
  <p class=lb>View</p>
  <p id=dn><span>Light</span><button>Day</button><button>Night</button></p>
  <p id=gp><span>GPS</span><button id=gb>off</button></p>
  <p class=sw><span>Collision</span><button id=cb>On</button></p>
  <p class=sw><span>Windows &amp; doors</span><button id=wi>Off</button></p>
  <p class=sw><span>House numbers</span><button id=ln>On</button></p>
  <p class=sw><span>Walk through buildings</span><button id=gw>Off</button></p>
  <p class=sw><span>Street names</span><button id=ls>On</button></p>
  <p class=sw><span>Stats</span><button id=hb>Off</button></p>
  <p class=lb>Detail</p>
  <p id=q><span>Level</span><button>Low</button><button>Medium</button><button>High</button></p>
  <p id=ci hidden><span>City</span></p>
  <p class=lb>Keys</p>
  <div id=ky>
    <b>W A S D</b><i>Fly</i>
    <b>Q / E</b><i>Down / up</i>
    <b>Shift</b><i>Faster</i>
    <b>Wheel</b><i>Speed</i>
    <b>1 – 6</b><i>Viewpoints</i>
    <b>G</b><i>GPS</i>
    <b>N</b><i>Day / night</i>
    <b>H</b><i>Stats</i>
    <b>C</b><i>Collision</i>
    <b>Esc</b><i>Settings</i>
  </div>
  <p id=pv></p>
</div>

<div id=drive hidden></div>
<pre id=i></pre>
<script>
/*SCRIPT*/
</script>
</body>
</html>
